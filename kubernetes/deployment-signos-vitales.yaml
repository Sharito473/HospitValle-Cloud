# deployment-signos-vitales.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signos-vitales-deployment
  labels:
    app: api-signos-vitales
spec:
  replicas: 4
  selector:
    matchLabels:
      app: api-signos-vitales
  template:
    metadata:
      labels:
        app: api-signos-vitales
    spec:
      containers:
      - name: api-signos-vitales
        image: api-signos-vitales:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 3
          periodSeconds: 5
